name: Migrate — crear tabla ticker_mensajes

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pg
        run: npm install pg

      - name: Run migration via Node.js (try all regions)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node - << 'EOF'
          const { Client } = require('pg');
          const fs = require('fs');

          const regions = [
            'sa-east-1',
            'us-east-1',
            'us-west-1',
            'eu-west-2',
            'eu-central-1',
            'ap-southeast-1',
            'ap-northeast-1',
          ];

          const sql = fs.readFileSync('supabase/migrations/ticker_mensajes.sql', 'utf8');

          async function tryRegion(region) {
            const client = new Client({
              host: `aws-0-${region}.pooler.supabase.com`,
              port: 5432,
              database: 'postgres',
              user: 'postgres.riodnurshlxbqzvkklvv',
              password: process.env.PGPASSWORD,
              ssl: { rejectUnauthorized: false },
              connectionTimeoutMillis: 5000,
            });
            try {
              await client.connect();
              await client.query(sql);
              await client.end();
              return region;
            } catch(e) {
              console.log(`${region}: ${e.message}`);
              try { await client.end(); } catch {}
              return null;
            }
          }

          (async () => {
            for (const region of regions) {
              console.log(`Probando ${region}...`);
              const ok = await tryRegion(region);
              if (ok) {
                console.log(`Migración exitosa en region: ${ok}`);
                process.exit(0);
              }
            }
            console.error('Ningún region funcionó');
            process.exit(1);
          })();
          EOF
