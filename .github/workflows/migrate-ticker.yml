name: Migrate — crear tabla ticker_mensajes

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dig
        run: sudo apt-get install -y dnsutils

      - name: Run migration (IPv4)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          HOST_IP=$(dig +short A db.riodnurshlxbqzvkklvv.supabase.co | head -1)
          echo "Conectando a $HOST_IP"
          psql \
            -h "$HOST_IP" \
            -p 5432 \
            -U postgres \
            -d postgres \
            -f supabase/migrations/ticker_mensajes.sql
