name: Migrate — crear tabla ticker_mensajes

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "${SUPABASE_DB_URL}?sslmode=require" -f supabase/migrations/ticker_mensajes.sql -v ON_ERROR_STOP=1
