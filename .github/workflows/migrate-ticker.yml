name: Migrate — crear tabla ticker_mensajes

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test connection
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            -h db.riodnurshlxbqzvkklvv.supabase.co \
            -p 5432 \
            -U postgres \
            -d postgres \
            --set=sslmode=require \
            -c "SELECT 1" \
            && echo "CONEXION OK"

      - name: Run migration
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            -h db.riodnurshlxbqzvkklvv.supabase.co \
            -p 5432 \
            -U postgres \
            -d postgres \
            --set=sslmode=require \
            -f supabase/migrations/ticker_mensajes.sql
