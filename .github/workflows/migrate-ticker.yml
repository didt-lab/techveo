name: Migrate — crear tabla ticker_mensajes

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pg
        run: npm install pg

      - name: Run migration via Node.js (IPv4)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node - << 'EOF'
          const { Client } = require('pg');
          const fs = require('fs');

          const client = new Client({
            host: 'aws-0-eu-west-2.pooler.supabase.com',
            port: 5432,
            database: 'postgres',
            user: 'postgres.riodnurshlxbqzvkklvv',
            password: process.env.PGPASSWORD,
            ssl: { rejectUnauthorized: false },
          });

          const sql = fs.readFileSync('supabase/migrations/ticker_mensajes.sql', 'utf8');

          client.connect()
            .then(() => client.query(sql))
            .then(() => { console.log('Migración exitosa'); return client.end(); })
            .catch(e => { console.error('Error:', e.message); process.exit(1); });
          EOF
